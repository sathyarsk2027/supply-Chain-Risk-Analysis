spring.application.name=monitor

# Database connection using environment variables
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator endpoints exposure
management.endpoints.web.exposure.include=health,info

# NewsAPI configuration
newsapi.key=${NEWSAPI_KEY}

# Scheduler configurations
scheduler.fetch-interval-ms=10000

# RSS Feed configuration
rss.fetch-interval-ms=10000
rss.feed-urls=https://www.freightwaves.com/feed,https://www.joc.com/rssfeed

# Gemini API configuration
gemini.model.name=${GEMINI_MODEL:gemini-1.5-flash}

# Groq API configuration
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
