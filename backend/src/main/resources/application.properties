spring.application.name=monitor
server.port=${PORT:8080}

# Database connection using environment variables
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator endpoints exposure
management.endpoints.web.exposure.include=health,info

# NewsAPI configuration
newsapi.key=${NEWSAPI_KEY}

# Scheduler configurations
scheduler.fetch-interval-ms=${SCHEDULER_FETCH_INTERVAL_MS:900000}

# RSS Feed configuration
rss.fetch-interval-ms=${RSS_FETCH_INTERVAL_MS:900000}
rss.feed-urls=https://www.freightwaves.com/feed,https://gcaptain.com/feed/,https://news.google.com/rss/search?q=supply+chain+disruption&hl=en-US&gl=US&ceid=US:en,https://news.google.com/rss/search?q=supply+chain+india&hl=en-IN&gl=IN&ceid=IN:en

# Gemini API configuration
gemini.model.name=${GEMINI_MODEL:gemini-1.5-flash}

# Groq API configuration
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama3-70b-8192

# NLP Microservice configuration (Explicit mapping for Render)
nlp.service.extract.url=${NLP_SERVICE_EXTRACT_URL:https://supply-chain-nlp.onrender.com/extract}
nlp.service.embed.url=${NLP_SERVICE_EMBED_URL:https://supply-chain-nlp.onrender.com/embed}

# Daily Digest Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${DIGEST_GMAIL_ADDRESS:}
spring.mail.password=${DIGEST_GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

digest.recipient.email=${DIGEST_RECIPIENT_EMAIL:}
digest.sender.name=Supply Chain Risk Monitor
digest.trigger.secret=${DIGEST_TRIGGER_SECRET:}
digest.dashboard.url=${DIGEST_DASHBOARD_URL:http://localhost:5173}
