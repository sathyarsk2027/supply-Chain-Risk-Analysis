spring.application.name=monitor
server.port=${PORT:8080}

# Database connection using environment variables with resilient fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:supplychain}}}
spring.datasource.username=${POSTGRES_USER:${PGUSER:postgres}}
spring.datasource.password=${POSTGRES_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool optimization for cloud free tiers (Supabase / Railway)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator endpoints exposure
management.endpoints.web.exposure.include=health,info

# NewsAPI configuration (default empty to avoid startup failure if missing)
newsapi.key=${NEWSAPI_KEY:}

# Scheduler configurations
scheduler.fetch-interval-ms=${SCHEDULER_FETCH_INTERVAL_MS:900000}

# RSS Feed configuration
rss.fetch-interval-ms=${RSS_FETCH_INTERVAL_MS:900000}
rss.feed-urls=https://www.freightwaves.com/feed,https://gcaptain.com/feed/,https://news.google.com/rss/search?q=supply+chain+disruption&hl=en-US&gl=US&ceid=US:en,https://news.google.com/rss/search?q=supply+chain+india&hl=en-IN&gl=IN&ceid=IN:en

# Gemini API configuration
gemini.model.name=${GEMINI_MODEL:gemini-1.5-flash}

# Groq API configuration (using active llama-3.3 model)
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# NLP Microservice configuration (Explicit mapping for Render)
nlp.service.extract.url=${NLP_SERVICE_EXTRACT_URL:https://supply-chain-nlp.onrender.com/extract}
nlp.service.embed.url=${NLP_SERVICE_EMBED_URL:https://supply-chain-nlp.onrender.com/embed}

# Daily Digest Email Configuration
resend.api.key=${RESEND_API_KEY:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${DIGEST_GMAIL_ADDRESS:}
spring.mail.password=${DIGEST_GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

digest.recipient.email=${DIGEST_RECIPIENT_EMAIL:}
digest.sender.name=Supply Chain Risk Monitor
digest.trigger.secret=${DIGEST_TRIGGER_SECRET:}
digest.dashboard.url=${DIGEST_DASHBOARD_URL:http://localhost:5173}
