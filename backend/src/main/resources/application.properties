spring.application.name=monitor

# Database connection using environment variables
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator endpoints exposure
management.endpoints.web.exposure.include=health,info

# NewsAPI configuration
newsapi.key=${NEWSAPI_KEY}

# Scheduler configurations
scheduler.fetch-interval-ms=${SCHEDULER_FETCH_INTERVAL_MS:900000}

# RSS Feed configuration
rss.fetch-interval-ms=${RSS_FETCH_INTERVAL_MS:900000}
rss.feed-urls=https://www.freightwaves.com/feed,https://gcaptain.com/feed/,https://news.google.com/rss/search?q=supply+chain+disruption&hl=en-US&gl=US&ceid=US:en

# Gemini API configuration
gemini.model.name=${GEMINI_MODEL:gemini-1.5-flash}

# Groq API configuration
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-70b-versatile

# NLP Microservice configuration (Explicit mapping for Render)
nlp.service.extract.url=${NLP_SERVICE_EXTRACT_URL:http://localhost:8000/extract}
nlp.service.embed.url=${NLP_SERVICE_EMBED_URL:http://localhost:8000/embed}
